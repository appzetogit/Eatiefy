<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    // Prevent chunk loading and dynamic import MIME type mismatch crashes on deployment updates
    (function() {
      function reloadPage(reason) {
        try {
          var lastReload = sessionStorage.getItem('chunk_reload_timestamp');
          var now = Date.now();
          // Cooldown of 10 seconds to avoid infinite reload loops (e.g., if offline or asset is truly missing)
          if (!lastReload || (now - parseInt(lastReload, 10)) > 10000) {
            sessionStorage.setItem('chunk_reload_timestamp', String(now));
            console.warn('Eatiefy: Chunk/Module load failure caught (' + reason + '). Reloading application...');
            window.location.reload();
          }
        } catch (e) {
          console.error('Eatiefy: Failed to handle reload', e);
        }
      }

      // 1. Listen for global uncaught module fetch and MIME type errors
      window.addEventListener('error', function(event) {
        var errorMsg = event.message || '';
        var errorObj = event.error;
        var errorObjMsg = errorObj ? (errorObj.message || String(errorObj)) : '';

        var isMimeOrImportError = 
          errorMsg.indexOf('Failed to fetch dynamically imported module') > -1 ||
          errorMsg.indexOf('Expected a JavaScript-or-Wasm module script') > -1 ||
          errorObjMsg.indexOf('Failed to fetch dynamically imported module') > -1 ||
          errorObjMsg.indexOf('Expected a JavaScript-or-Wasm module script') > -1;

        if (isMimeOrImportError) {
          reloadPage('Error Event: ' + (errorMsg || errorObjMsg));
          return;
        }

        // 2. Capture failed <script> / <link> tag loads (e.g. 404 on old hashes)
        if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
          var url = event.target.src || event.target.href || '';
          if (url && (url.indexOf('/assets/') > -1 || url.indexOf('.js') > -1)) {
            reloadPage('Asset Load Failure: ' + url);
          }
        }
      }, true); // Must use capture phase to intercept resource loading errors

      // 3. Listen for unhandled promise rejections (Vite dynamic import failures are rejected promises)
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var reasonMsg = reason ? (reason.message || String(reason)) : '';
        if (reasonMsg.indexOf('Failed to fetch dynamically imported module') > -1) {
          reloadPage('Unhandled Rejection: ' + reasonMsg);
        }
      });

      // 4. Vite-specific preload error handler
      window.addEventListener('vite:preloadError', function(event) {
        reloadPage('Vite Preload Error');
      });
    })();
  </script>
  <script>
    // POS / handheld detection (runs before first paint so there is no layout flash).
    //
    // Some POS terminals (e.g. iMin) report a CSS width >= 768px, which makes the
    // restaurant panel fall into its tablet/desktop web layout: the mobile footer
    // (md:hidden) disappears and the fixed order popup is shifted for a sidebar
    // that a handheld operator does not want. This flag lets the restaurant CSS
    // keep the full phone layout on such devices.
    //
    // Phones are < 768px, so they never match this and are completely unaffected;
    // laptops/desktops have a fine pointer + hover, so they are excluded too. The
    // flag only turns on for a touch-only handheld that happens to be >= 768px, or
    // for a device whose UA identifies it as an iMin terminal.
    (function () {
      try {
        var ua = String(navigator.userAgent || '').toLowerCase();
        // iMin WebViews report only the model code (e.g. "I23M01" = Swift 2,
        // "I22T01", "I22D01"), never "imin" or the marketing name.
        var isPos = /\bi2\d[a-z]\d{2}\b/.test(ua) ||
                    ua.indexOf('imin') > -1 ||
                    ua.indexOf('swift') > -1 ||
                    ua.indexOf('pos') > -1 ||
                    ua.indexOf('sunmi') > -1 ||
                    ua.indexOf('pax') > -1;
        var coarseNoHover =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(pointer: coarse)').matches &&
          window.matchMedia('(hover: none)').matches;
        var wideHandheld =
          coarseNoHover && window.matchMedia('(min-width: 768px)').matches;
        if (isPos || wideHandheld) {
          document.documentElement.setAttribute('data-pos-device', 'true');
        }
      } catch (e) { /* detection is best-effort; default (no flag) keeps web layout */ }
    })();
  </script>
  <link rel="preload" as="image" href="/assets/images/eatiefy_logo.webp" fetchpriority="high" />
  <link rel="icon" type="image/jpeg" href="/EatiefyUserAppLogo.jpeg?v=3" />
  <!-- iOS only delivers web push to a Home Screen web app, which needs a manifest. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/images/eatiefy_logo.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Eatiefy" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!--
    viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
    values. Without it iOS reports 0 for every inset, so the safe-area CSS
    already used across the app was silently doing nothing and fixed bottom
    bars sat under the home indicator / gesture bar.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FEEFC2" />
  <style>
    html, body {
      margin: 0; padding: 0; background: #FEEFC2;
    }
    /* Brand splash shown until the app mounts: same cream/gold as the logo
       artwork, so there is no black/white flash around the green logo. */
    .initial-loader {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: #FEEFC2;
    }
    .initial-loader img {
      width: min(62vw, 280px); height: auto; border-radius: 28px;
      animation: splash-pop .5s ease-out both;
    }
    @keyframes splash-pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://maps.googleapis.com">
  <link rel="preconnect" href="https://maps.gstatic.com" crossorigin>
  <title>Eatiefy</title>
  <!-- One non-render-blocking font request (was two blocking stylesheets that
       also loaded Outfit twice). The splash above shows meanwhile. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&family=Caveat:wght@400;700&family=Yellowtail&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&family=Caveat:wght@400;700&family=Yellowtail&display=swap"
      rel="stylesheet">
  </noscript>
</head>

    <div class="initial-loader" aria-label="Loading Eatiefy">
      <img src="/assets/images/eatiefy_logo.webp" alt="Eatiefy" width="280" height="280" decoding="async" fetchpriority="high" />
    </div>
  </div>

</body>

</html>
